version: '3.9'

services:
  backend:
    build:
      context: ./backend
    container_name: ncig-backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - FRONTEND_ORIGIN=http://localhost:5173
    volumes:
      - ncig-db-data:/app/data
    restart: unless-stopped
    networks:
      - ncig-network

  frontend:
    build:
      context: ./frontend
    container_name: ncig-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ncig-network

volumes:
  ncig-db-data:

networks:
  ncig-network:
    driver: bridge
